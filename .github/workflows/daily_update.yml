name: Daily Intelligence Update

on:
  schedule:
    # Run every day at 06:00 AM Taiwan time (22:00 UTC)
    - cron: '0 22 * * *'
  workflow_dispatch:
    # Allows manual triggering from GitHub UI

permissions:
  contents: write

# Prevent two updates from racing and overwriting page.tsx/docs.
concurrency:
  group: daily-intelligence-update
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Run daily update script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Set git config so commit succeeds
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Run the update script with -u to bypass stdout buffering
          python -u automate_update.py
