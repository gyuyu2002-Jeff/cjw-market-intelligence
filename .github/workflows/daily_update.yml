name: Daily Intelligence Update

on:
  schedule:
    # Run every day at 08:30 AM Taiwan time (00:30 UTC)
    - cron: '30 0 * * *'
  workflow_dispatch:
    # Allows manual triggering from GitHub UI

permissions:
  contents: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Diagnostic check API Key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -c "
          import os, urllib.request, json, urllib.error
          key = os.environ.get('GEMINI_API_KEY', '').strip()
          print('--- GEMINI API KEY DIAGNOSTICS ---')
          print('Key Length:', len(key))
          if key:
              print('Key starts with:', key[:6])
              print('Key ends with:', key[-4:] if len(key) > 4 else '')
              try:
                  url = f'https://generativelanguage.googleapis.com/v1beta/models?key={key}'
                  res = urllib.request.urlopen(url)
                  data = json.loads(res.read().decode('utf-8'))
                  models = [m['name'] for m in data.get('models', [])]
                  print('Total models available:', len(models))
                  print('All models list:', models)
                  
                  # Test direct generation call
                  print('\nTesting generateContent for gemini-1.5-flash...')
                  test_url = f'https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key={key}'
                  body = {'contents': [{'parts': [{'text': 'Hello'}]}]}
                  req = urllib.request.Request(test_url, data=json.dumps(body).encode('utf-8'), headers={'Content-Type': 'application/json'})
                  with urllib.request.urlopen(req) as test_res:
                      print('gemini-1.5-flash call success:', test_res.read().decode('utf-8')[:100])
              except urllib.error.HTTPError as e:
                  print('HTTP Error:', e.code, e.reason)
                  print('Response body:', e.read().decode('utf-8'))
              except Exception as e:
                  print('Error testing key:', e)
          else:
              print('Key is empty!')
          print('----------------------------------')
          "

      - name: Run daily update script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Set git config so commit succeeds
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Run the update script (which crawls news, compiles the site, and pushes commits)
          python automate_update.py
